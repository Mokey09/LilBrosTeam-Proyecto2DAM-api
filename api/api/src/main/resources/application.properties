# Nombre de la aplicacion
spring.application.name=api

# Acceso a la base de datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Puerto de escucha del servidor
server.port=8080

# Datos de conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/moscosos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Clave secreta para firmar los JWT (Base64, mínimo 256 bits).
# NO la escribas aquí: se lee de la variable de entorno JWT_SECRET.
# Para generarla:  powershell [Convert]::ToBase64String((1..32 | % { Get-Random -Maximum 256 }))
app.jwt.secret=IJVv/1dz3gGr5WfVpJydaem76aoSEatOq5YSyyc3KIs=

# Validez del token en milisegundos (3600000 = 1 hora)
app.jwt.expiration-ms=3600000

# OPCIONAL: datos del primer DIRECTOR que se crea al arrancar si la tabla está vacía
# (ver DataInitializer). Si no se definen, no se crea ninguno.
app.admin.email=${ADMIN_EMAIL:admin@test.com}
app.admin.password=${ADMIN_PASSWORD:admin1234}
